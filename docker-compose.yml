version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: discord_bot_db
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: discord_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./discord_bot/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  discord_bot:
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./discord_bot:/app:delegated
    entrypoint: >
      sh -c "python -m pip install --upgrade pip setuptools wheel && \
      if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi && \
      fastapi run main.py --reload"
    depends_on:
      db:
        condition: service_healthy

  web-controller:
    image: node:20-alpine
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_DISCORD_BOT_URL=http://localhost:8000
      - VITE_DISCORD_CLIENT_ID=${VITE_DISCORD_CLIENT_ID}
    working_dir: /app
    volumes:
      - ./web_controller:/app
      - /app/node_modules
    command: >-
      sh -c "npm install -g pnpm && pnpm i && pnpm run dev --host 0.0.0.0"
    depends_on:
      - discord_bot

volumes:
  postgres_data: